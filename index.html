<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나복집</title>
<style>
  :root {
    --bg-cream: #FBF3E3;
    --line: #2b2b2b;
    --text: #2b2b2b;
    --muted: #8a8a8a;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg-cream);
    color: var(--text);
    font-family: "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }

  /* ===== 상단 헤더 ===== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 24px;
  }

  .logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text);
    /* 로고 이미지 준비되면 아래처럼 교체하세요:
       <img src="logo.png" alt="나복집 로고" class="logo-img">
    */
  }

  nav {
    display: flex;
    gap: 28px;
  }

  nav button {
    background: none;
    border: none;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    padding: 4px 2px;
    border-bottom: 2px solid transparent;
    transition: border-color 0.2s ease, opacity 0.2s ease;
  }

  nav button:hover {
    opacity: 0.7;
  }

  nav button.active {
    border-bottom: 2px solid var(--text);
    font-weight: 600;
  }

  /* ===== 메뉴 이미지가 보여지는 영역 ===== */
  main {
    display: flex;
    justify-content: center;
    padding: 20px 16px 60px;
  }

  .menu-frame {
    width: 100%;
    max-width: 520px;
    min-height: 640px;
    background: #ffffff;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .menu-frame img {
    width: 100%;
    height: auto;
    display: block;
  }

  .placeholder {
    color: var(--muted);
    font-size: 18px;
  }

  @media (max-width: 480px) {
    header {
      padding: 18px 16px;
    }
    nav {
      gap: 18px;
    }
    nav button {
      font-size: 14px;
    }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">로고이미지</div>
    <nav>
      <button class="menu-btn active" data-menu="kr">EN</button>
      <button class="menu-btn" data-menu="jp">日本語</button>
      <button class="menu-btn" data-menu="cn">中文</button>
    </nav>
  </header>

  <main>
    <div class="menu-frame" id="menuFrame">
      <span class="placeholder" id="menuContent">이미지</span>
    </div>
  </main>

  <script>
    // 언어(메뉴)별 이미지 경로를 여기에 넣어주세요.
    // 이미지 준비가 완료되면 각 값을 실제 파일 경로로 바꾸면 됩니다.
    const menuImages = {
      kr: "images/menu-kr.png",
      en: "images/menu-en.png",
      jp: "images/menu-jp.png",
    };

    const buttons = document.querySelectorAll(".menu-btn");
    const menuFrame = document.getElementById("menuFrame");

    function showMenu(key) {
      // 활성 버튼 표시
      buttons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.menu === key);
      });

      const src = menuImages[key];

      // 이미지가 아직 준비되지 않았으므로 우선 텍스트로 표시
      // 실제 이미지 파일을 넣은 후에는 아래 주석의 코드로 교체하세요.
      /*menuFrame.innerHTML = `<span class="placeholder">이미지 (${key})</span>`;*/

      /* 이미지 파일 준비 후 사용할 코드:*/
      menuFrame.innerHTML = `<img src="gemini.png"${src}" alt="${key} 메뉴">`;
      
    }

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => showMenu(btn.dataset.menu));
    });

    // 초기 화면
    showMenu("kr");
  </script>

</body>
</html>
